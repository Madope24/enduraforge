# Every check: server lint + tests (SQLite and Postgres), plan freshness, dependency audit, secret scan,
# server image build, and the Flutter app (analyze, test, release APK).
# Runs on pull requests and branch pushes, and is reused by deploy and release.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
    inputs:
      upload_apk:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salum
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: salum
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U salum -d salum"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://salum:ci-only-password@localhost:5432/salum
        run: python -m pytest -q
      - name: Bundled plan is current
        working-directory: .
        run: python plan/gen_plan.py --check
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image (no push)
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project and patch it
        run: |
          flutter create --org com.enduraforge --project-name enduraforge --platforms android .
          rm -f test/widget_test.dart
          python3 android_patch.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Name the APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "build/enduraforge-${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'workflow_call' || inputs.upload_apk }}
        with:
          name: enduraforge-apk
          path: app/build/enduraforge-*.apk
          retention-days: 30
