# Secret scan config used by the ci workflow. Extends the default gitleaks rules.
title = "enduraforge gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Throwaway values used only for local development and tests"
paths = [
  '''server/tests/.*''',
  '''^docker-compose\.yml$''',
  '''\.github/workflows/ci\.yml''',
]
regexes = [
  '''dev-only-secret-change-me-dev-only-secret''',
  '''test-secret-test-secret-test-secret-1234''',
  '''ci-only-password''',
]
